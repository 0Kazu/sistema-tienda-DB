{% extends "base.html" %}

{% block content %}
    <div class="row justify-content-center mt-4">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white p-3">
                    <h4 class="mb-0"><i class="fas fa-user-edit"></i> Editar Usuario #{{ usuario.id_usuario }}</h4>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('usuarios.editar', id_usuario=usuario.id_usuario) }}" method="POST">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" name="correo" class="form-control" value="{{ usuario.correo }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Rol en el Sistema</label>
                            <select name="rol" class="form-select" required>
                                <option value="Administrador" {% if usuario.rol == 'Administrador' %}selected{% endif %}>Administrador</option>
                                <option value="Vendedor" {% if usuario.rol == 'Vendedor' %}selected{% endif %}>Vendedor</option>
                                <option value="Bodeguero" {% if usuario.rol == 'Bodeguero' %}selected{% endif %}>Bodeguero</option>
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Estado de la Cuenta</label>
                            <select name="estado" class="form-select" required>
                                <option value="Activo" {% if usuario.estado == 'Activo' %}selected{% endif %}>Activo</option>
                                <option value="Inactivo" {% if usuario.estado == 'Inactivo' %}selected{% endif %}>Inactivo</option>
                            </select>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('usuarios.listar') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
