{% extends "base.html" %}
{% block content %}
<h2>Crear Nuevo Pedido</h2>
<div class="card p-4 mt-3">
    <form action="{{ url_for('pedidos.crear') }}" method="POST">
        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select name="id_cliente" class="form-select" required>
                {% for c in clientes %}
                <option value="{{ c.id_cliente }}">{{ c.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Vendedor (Usuario)</label>
            <select name="id_usuario" class="form-select" required>
                {% for u in usuarios %}
                <option value="{{ u.id_usuario }}">{{ u.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Método de Pago</label>
            <select name="id_metodo_pago" class="form-select" required>
                {% for m in metodos_pago %}
                <option value="{{ m.id_metodo_pago }}">{{ m.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Generar Orden</button>
        <a href="{{ url_for('pedidos.listar') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
