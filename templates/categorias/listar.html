{% extends "base.html" %}
{% block content %}
<div class="row mb-4">
    <div class="col-md-8">
        <h2>Gestión de Categorías</h2>
    </div>
    <div class="col-md-4 text-end">
        <a href="{{ url_for('productos.listar') }}" class="btn btn-secondary">⬅ Volver a Productos</a>
    </div>
</div>

<div class="row">
    <!-- Formulario rápido para crear categoría -->
    <div class="col-md-4">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white">Nueva Categoría</div>
            <div class="card-body">
                <form action="{{ url_for('categorias.crear') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" required placeholder="Ej. Periféricos">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3" placeholder="Opcional..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Guardar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Tabla de categorías existentes -->
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for c in categorias %}
                        <tr>
                            <td class="text-secondary fw-bold">#{{ c.id_categoria }}</td>
                            <td class="fw-bold">{{ c.nombre }}</td>
                            <td>{{ c.descripcion }}</td>
                            <td class="text-center">
                                <a href="{{ url_for('categorias.editar', id_categoria=c.id_categoria) }}" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-edit"></i> Editar
                                </a>
                                <form action="{{ url_for('categorias.eliminar', id_categoria=c.id_categoria) }}" method="POST" class="d-inline" onsubmit="return confirm('¿Seguro que deseas eliminar la categoría {{ c.nombre }}?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">No hay categorías registradas.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
