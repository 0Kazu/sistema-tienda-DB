{% extends "base.html" %}
{% block content %}
<div class="row mb-4">
    <div class="col-md-8">
        <h2>Gestión de Categorías</h2>
    </div>
    <div class="col-md-4 text-end">
        <a href="{{ url_for('productos.listar') }}" class="btn btn-secondary">⬅ Volver a Productos</a>
    </div>
</div>

<div class="row">
    <!-- Formulario rápido para crear categoría -->
    <div class="col-md-4">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white">Nueva Categoría</div>
            <div class="card-body">
                <form action="{{ url_for('categorias.crear') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" required placeholder="Ej. Periféricos">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3" placeholder="Opcional..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Guardar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Tabla de categorías existentes -->
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for c in categorias %}
                        <tr>
                            <td>{{ c.id_categoria }}</td>
                            <td class="fw-bold">{{ c.nombre }}</td>
                            <td>{{ c.descripcion }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="text-center">No hay categorías registradas.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
