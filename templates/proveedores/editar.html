{% extends "base.html" %}
{% block content %}
    <div class="row justify-content-center mt-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white p-3">
                    <h5 class="mb-0"><i class="fas fa-truck"></i> Editar Proveedor #{{ proveedor.id_proveedor }}</h5>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('proveedores.editar', id_proveedor=proveedor.id_proveedor) }}" method="POST">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre de la Empresa</label>
                            <input type="text" name="nombre" class="form-control" value="{{ proveedor.nombre }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Contacto (Teléfono/Email)</label>
                            <input type="text" name="contacto" class="form-control" value="{{ proveedor.contacto }}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Estado del Proveedor</label>
                            <select name="estado" class="form-select" required>
                                <option value="Activo" {% if proveedor.estado == 'Activo' %}selected{% endif %}>Activo</option>
                                <option value="Inactivo" {% if proveedor.estado == 'Inactivo' %}selected{% endif %}>Inactivo</option>
                            </select>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('proveedores.listar') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
